{% extends 'base.html' %}

{% block content %}
<h2>Add new place</h2>

<form method="post" class="place-form">
    {% csrf_token %}
    
    {% for field in form %}
    <div class="form-field">
        {{ field.label_tag }}
        {{ field }}
        {% if field.errors %}
        <div class="error">{{ field.errors }}</div>
        {% endif %}
    </div>
    {% endfor %}
    
    <button type="submit" class="btn btn-primary">Save</button>
    <a href="{% url 'places:place_list' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
